name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-and-syntax:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Python source syntax (not a native Windows service test)
        run: python -m compileall -q pgw.py service.py workspace.py runtime.py codex_bridge.py code_index.py launch.py scripts tests
      - name: Frontend contracts and portable configuration
        run: node --test tests/test_code_refresh.mjs tests/test_runtime_ui.mjs tests/test_view_sync.mjs tests/test_release_config.mjs
