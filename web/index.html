<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Project Manager · 项目管理</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand"><span class="brandmark">⌘</span><strong>Codex Project Manager</strong><span class="edition">WORKSPACE</span></div><label for="project-select">选择项目</label><select id="project-select" aria-label="选择项目"></select><button id="attach-project" class="secondary">按目录接入</button><div id="project-name">正在打开项目…</div><span id="connection" class="connection">连接中</span></header>
<div class="shell">
 <aside class="sidebar"><div class="project-card"><span class="eyebrow">当前项目</span><h2 id="project-title">—</h2><p id="project-goal"></p></div><div class="nav-label">工作区</div><nav id="views"></nav><div class="nav-label tree-heading">项目对象 <span id="node-count"></span></div><nav id="explorer"></nav><footer><span class="local-dot"></span> 本地持久保存<br><small id="storage-hint">状态独立于聊天</small></footer></aside>
 <main><div class="toolbar"><div><span id="view-kicker" class="eyebrow">PROJECT OVERVIEW</span><h1 id="view-title">项目总览</h1></div><div class="toolbar-actions"><label class="search"><span>⌕</span><input id="search" aria-label="搜索项目对象" placeholder="搜索标题、想法或证据…"></label><button id="import-btn" class="secondary">历史导入</button><button id="link-btn" class="secondary">关联对象</button><button id="new-btn" class="primary">＋ 新建</button></div></div><div id="notice" role="status" hidden></div><div id="view-controls"></div><section id="content" aria-live="polite"></section><div class="statusbar"><span id="project-stats"></span><button id="refresh" class="textbutton">刷新状态 ↻</button></div></main>
 <aside id="inspector" class="inspector"><div class="empty-inspector"><div class="node-icon">◇</div><h3>每个结果，都有来处</h3><p>选择一个对象，查看状态、原件、关联任务和执行聊天。</p><div class="hint">知识与执行相连<br>状态与聊天分离</div></div></aside>
</div>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="dialog-title">新建对象</h2><button type="button" id="close-dialog" class="iconbutton" aria-label="关闭">×</button></div><div id="form-fields"></div><div id="form-error" role="alert"></div><div class="dialog-actions"><button type="button" id="cancel-dialog" class="secondary">取消</button><button type="submit" id="save-btn" class="primary">保存到项目</button></div></form></dialog>
<dialog id="source-dialog"><div class="dialog-head"><h2>原始来源</h2><button id="close-source" class="iconbutton" aria-label="关闭原件">×</button></div><p id="source-path"></p><p id="source-freshness" class="panel-note" role="status"></p><pre id="source-text"></pre></dialog>
<script src="/app.js"></script></body></html>
